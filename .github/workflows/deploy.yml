name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Odd minute, off the hour — GitHub silently drops schedule runs
    # queued at round hours (e.g. "0 6") when Actions is under load.
    - cron: "43 5 * * *"
  # Fired by the AppGrid repo's "Notify website of release" workflow when
  # a new release is published, so the site rebuilds with the new version
  # data immediately instead of waiting up to 24h for the cron.
  repository_dispatch:
    types: [appgrid-release]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Astro cache (image pipeline + stars)
        uses: actions/cache@v4
        with:
          path: .astro
          key: astro-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-

      - name: Build site
        run: bun run build
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
